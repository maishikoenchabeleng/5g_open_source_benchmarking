# Example config for a locally deployed CU listening on the localhost inter>

cu_cp:
  inactivity_timer: 600   # max secs allowed before default srsUE kill
  amf:
    addrs: 137.158.126.21        #CN AMF address
    bind_addrs: 137.158.126.21
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
                sd: 0x000001
  f1ap:
    bind_addrs: 137.158.126.21             #Address DU connects to

cu_up:
  ngu:
    socket:
      - bind_addr: 127.0.0.20         #N3 towards the UPF(UPF owns .21:2152)
  f1u:
    bind_port: 2153
    socket:
      - bind_addr: 137.158.126.21          # N3 towards the UPF

log:
  filename: /tmp/cu.log
  all_level: warning

pcap:
  ngap_enable: false
  ngap_filename: /tmp/cu_ngap.pcap

